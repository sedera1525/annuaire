name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/societies
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            # Sync plugin WordPress (fichiers PHP hors Docker)
            WP_PLUGIN_DIR="/var/www/html/wp-content/plugins/societies-connector"
            if [ -d "$WP_PLUGIN_DIR" ]; then
              rsync -a --delete /opt/societies/wordpress/societies-connector/ "$WP_PLUGIN_DIR/"
              echo "✅ Plugin WordPress synchronisé"
            else
              echo "⚠️  Répertoire plugin WP introuvable : $WP_PLUGIN_DIR"
            fi
