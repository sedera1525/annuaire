services:
  societies:
    build: .
    ports:
      - "127.0.0.1:8090:8090"   # exposé en local uniquement (Nginx devant)
    volumes:
      - ./0.csv:/app/0.csv:ro
      - ./societies.duckdb:/app/societies.duckdb
      - ./fiches.db:/app/fiches.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
