services:
  societies:
    build: .
    ports:
      - "0.0.0.0:8090:8090"
    volumes:
      - ./0.csv:/app/0.csv:ro
      - ./societies.duckdb:/app/societies.duckdb
      - ./fiches.db:/app/fiches.db
      - /etc/machine-id:/etc/machine-id:ro
      - ./license.key:/app/license.key:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
